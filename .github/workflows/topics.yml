# Today's news topics for the Mochi robots (firmware v30+): a few kid-safe headlines in topics/topics.json.
# Installed on the update hub by: python tools/publish.py topics   (source: mochi_v4/tools/hub/)
name: News topics
on:
  schedule:
    - cron: '30 0 * * *'        # every day, 06:30 in Bangladesh
  workflow_dispatch:
permissions:
  contents: write
jobs:
  topics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect and filter today's headlines
        run: |
          mkdir -p topics
          python tools/topics.py > topics/new.json && mv topics/new.json topics/topics.json || rm -f topics/new.json
      - name: Save them on the hub
        run: |
          git config user.name "mochi-topics"
          git config user.email "actions@users.noreply.github.com"
          git add topics/topics.json
          git diff --cached --quiet || git commit -m "News topics $(date -u +%F)"
          git push
